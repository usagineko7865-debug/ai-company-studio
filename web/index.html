<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Company Studio</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo">A</span><div><b>AI Company</b><small>STUDIO</small></div></div>
      <button class="new-chat" id="newChat" data-i18n="newChat">＋ 新しい役員会</button>
      <nav>
        <button class="nav active" data-view="chat" data-i18n="board">◉　AI役員会</button>
        <button class="nav" data-view="projects" data-i18n="projects">▣　事業案</button>
        <button class="nav" data-view="company" data-i18n="company">◇　会社設定</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="budget"><span data-i18n="budgetGuard">API予算ガード</span><strong id="budget">¥50</strong></div>
        <button class="theme-toggle" id="themeToggle" data-i18n="darkMode">☾ ダークモード</button>
      </div>
    </aside>

    <main>
      <header><div><h1 id="pageTitle">AI役員会</h1><p id="companyLabel">My AI Company</p></div>
        <div class="header-actions"><select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option><option value="pt-BR">Português</option><option value="es">Español</option></select><label class="mode"><span data-i18n="mock">無料練習</span><input id="realMode" type="checkbox"><i></i><span data-i18n="real">実AI</span></label></div>
      </header>

      <section class="view active" id="chatView">
        <div class="messages" id="messages">
          <div class="welcome"><div class="hero-mark">AI</div><h2 data-i18n="welcomeTitle">今日は何を事業にしますか？</h2>
            <p data-i18n="welcomeText">あなたのアイデアを、2人のAI役員が事業の視点で検討します。</p>
            <div class="suggestions">
              <button data-i18n="suggest1">1,000円で始められる事業を考える</button><button data-i18n="suggest2">このアイデアの弱点を検証する</button>
              <button data-i18n="suggest3">売れるデジタル商品を企画する</button>
            </div></div>
        </div>
        <div class="composer"><textarea id="messageInput" data-i18n-placeholder="placeholder" placeholder="役員会に相談する…"></textarea>
          <div class="composer-actions"><span data-i18n="enterHint">Enterで送信・Shift+Enterで改行</span><button id="sendButton">➤</button></div></div>
        <div class="notice" data-i18n="notice">AIの提案は間違うことがあります。公開・販売・購入は人間が確認してください。</div>
      </section>

      <section class="view" id="projectsView"><div class="content-head"><h2 data-i18n="projectsTitle">事業案</h2><p data-i18n="projectsText">役員会から保存したアイデアを管理します。</p></div><div class="project-grid" id="projectGrid"></div></section>

      <section class="view" id="companyView"><div class="content-head"><h2 data-i18n="companyTitle">会社設定</h2><p data-i18n="companyText">AI役員が判断するための会社情報です。</p></div>
        <form class="settings-card" id="companyForm">
          <label><span data-i18n="companyName">会社名</span><input id="companyName"></label><label><span data-i18n="mission">会社の目的</span><input id="mission"></label>
          <label><span data-i18n="customer">主な顧客</span><input id="customer"></label><label><span data-i18n="operatingBudget">運営予算（円）</span><input id="operatingBudget" type="number" min="0"></label>
          <button type="submit" data-i18n="save">変更を保存</button>
        </form></section>
    </main>
  </div>
  <div class="toast" id="toast"></div><script src="/i18n.js"></script><script src="/app.js"></script>
</body></html>
