<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Company Studio</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="logo">A</span><div><b>AI Company</b><small>STUDIO</small></div></div>
      <button class="new-chat" id="newChat">＋ 新しい役員会</button>
      <nav>
        <button class="nav active" data-view="chat">◉　AI役員会</button>
        <button class="nav" data-view="projects">▣　事業案</button>
        <button class="nav" data-view="company">◇　会社設定</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="budget"><span>API予算ガード</span><strong id="budget">¥50</strong></div>
        <button class="theme-toggle" id="themeToggle">☾ ダークモード</button>
      </div>
    </aside>

    <main>
      <header><div><h1 id="pageTitle">AI役員会</h1><p id="companyLabel">My AI Company</p></div>
        <label class="mode"><span>無料練習</span><input id="realMode" type="checkbox"><i></i><span>実AI</span></label>
      </header>

      <section class="view active" id="chatView">
        <div class="messages" id="messages">
          <div class="welcome"><div class="hero-mark">AI</div><h2>今日は何を事業にしますか？</h2>
            <p>あなたのアイデアを、2人のAI役員が事業の視点で検討します。</p>
            <div class="suggestions">
              <button>1,000円で始められる事業を考える</button><button>このアイデアの弱点を検証する</button>
              <button>売れるデジタル商品を企画する</button>
            </div></div>
        </div>
        <div class="composer"><textarea id="messageInput" placeholder="役員会に相談する…"></textarea>
          <div class="composer-actions"><span>Enterで送信・Shift+Enterで改行</span><button id="sendButton">➤</button></div></div>
        <div class="notice">AIの提案は間違うことがあります。公開・販売・購入は人間が確認してください。</div>
      </section>

      <section class="view" id="projectsView"><div class="content-head"><h2>事業案</h2><p>役員会から保存したアイデアを管理します。</p></div><div class="project-grid" id="projectGrid"></div></section>

      <section class="view" id="companyView"><div class="content-head"><h2>会社設定</h2><p>AI役員が判断するための会社情報です。</p></div>
        <form class="settings-card" id="companyForm">
          <label>会社名<input id="companyName"></label><label>会社の目的<input id="mission"></label>
          <label>主な顧客<input id="customer"></label><label>運営予算（円）<input id="operatingBudget" type="number" min="0"></label>
          <button type="submit">変更を保存</button>
        </form></section>
    </main>
  </div>
  <div class="toast" id="toast"></div><script src="/app.js"></script>
</body></html>
